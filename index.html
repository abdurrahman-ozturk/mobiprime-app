<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MobiPrime.uz — Premium Aksessuarlar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
    }
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 px-4 py-3 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-blue-500 flex items-center justify-center shadow-lg shadow-sky-500/30">
        <i data-lucide="smartphone" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-none">MobiPrime<span class="text-sky-400">.uz</span></h1>
        <p class="text-[11px] text-slate-400 mt-0.5">Online Aksessuarlar Do'koni</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="cartHeaderBtn" onclick="openCart()" class="relative p-2 rounded-xl bg-slate-800 border border-slate-700/60 active:scale-95 transition-all text-slate-200">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span id="cartCountBadge" class="hidden absolute -top-1.5 -right-1.5 bg-sky-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-md">0</span>
      </button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="px-4 pt-3 pb-1">
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
      <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Aksessuarlarni qidirish..." 
        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-500 transition-colors">
    </div>
  </div>

  <!-- Category Pills -->
  <div class="px-4 py-2.5 overflow-x-auto custom-scroll flex space-x-2">
    <button onclick="setCategory('all')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-sky-500 text-white shadow-sm" data-cat="all">
      Barchasi
    </button>
    <button onclick="setCategory('audio')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60" data-cat="audio">
      🎧 Quloqchinlar
    </button>
    <button onclick="setCategory('charge')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60" data-cat="charge">
      🔌 Zaryadka & Kabellar
    </button>
    <button onclick="setCategory('powerbank')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60" data-cat="powerbank">
      🔋 Powerbank
    </button>
    <button onclick="setCategory('cases')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60" data-cat="cases">
      📱 Chexol & Oyna
    </button>
    <button onclick="setCategory('auto')" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60" data-cat="auto">
      🚗 Avto aksessuar
    </button>
  </div>

  <!-- Products Grid -->
  <main class="px-4 pt-1">
    <div id="productsGrid" class="grid grid-cols-2 gap-3">
      <!-- Dynamic Products injected by JS -->
    </div>
    <div id="noResults" class="hidden text-center py-16">
      <i data-lucide="package-search" class="w-12 h-12 text-slate-500 mx-auto mb-2"></i>
      <p class="text-sm text-slate-400">Hech qanday mahsulot topilmadi</p>
    </div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="floatingCartBar" class="hidden fixed bottom-4 left-4 right-4 z-40">
    <button onclick="openCart()" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-semibold flex items-center justify-between shadow-xl shadow-sky-500/30 active:scale-[0.98] transition-all">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center">
          <i data-lucide="shopping-cart" class="w-4 h-4 text-white"></i>
        </div>
        <span id="floatingCartCount" class="text-sm font-medium">0 ta mahsulot</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <span id="floatingCartTotal" class="text-base font-bold">0 so'm</span>
        <i data-lucide="arrow-right" class="w-4 h-4 text-white"></i>
      </div>
    </button>
  </div>

  <!-- Cart & Checkout Modal Drawer -->
  <div id="cartModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex flex-col justify-end transition-opacity">
    <div class="w-full max-h-[90vh] bg-slate-900 border-t border-slate-800 rounded-t-3xl flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
      
      <!-- Drawer Header -->
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center">
            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-white">Savat & Buyurtma</h2>
            <p id="modalItemsCount" class="text-xs text-slate-400">0 ta tovar tanlandi</p>
          </div>
        </div>
        <button onclick="closeCart()" class="p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Drawer Body (Scrollable) -->
      <div class="overflow-y-auto px-5 py-4 space-y-4 max-h-[60vh] custom-scroll">
        <!-- Selected Items -->
        <div id="cartItemsList" class="space-y-2.5">
          <!-- Injected items -->
        </div>

        <!-- Total Price Card -->
        <div class="p-3.5 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-between">
          <span class="text-sm font-medium text-slate-300">Jami to'lov:</span>
          <span id="modalTotalSum" class="text-lg font-bold text-sky-400">0 so'm</span>
        </div>

        <!-- Delivery & Customer Form -->
        <div class="space-y-3 pt-1">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Buyurtma ma'lumotlari</h3>
          
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Ismingiz *</label>
            <input type="text" id="custName" placeholder="Ismingizni kiriting" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Telefon raqamingiz *</label>
            <input type="tel" id="custPhone" placeholder="+998 90 123 45 67" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Yetkazib berish manzili *</label>
            <textarea id="custAddress" rows="2" placeholder="Shahar, tuman, ko'cha, uy raqami" class="w-full px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500 resize-none"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">To'lov usuli</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center space-x-2 p-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer">
                <input type="radio" name="payMethod" value="Naqd (yetkazilganda)" checked class="text-sky-500 focus:ring-0">
                <span class="text-xs text-white">💵 Naqd pulda</span>
              </label>
              <label class="flex items-center space-x-2 p-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer">
                <input type="radio" name="payMethod" value="Karta (Payme/Click)" class="text-sky-500 focus:ring-0">
                <span class="text-xs text-white">💳 Karta orqali</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Izoh (ixtiyoriy)</label>
            <input type="text" id="custComment" placeholder="Masalan: pod'yezd kodi, eshik rangi" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>
      </div>

      <!-- Drawer Footer Action -->
      <div class="p-4 border-t border-slate-800 bg-slate-900">
        <button id="submitOrderBtn" onclick="submitOrder()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-semibold text-sm flex items-center justify-center space-x-2 shadow-lg shadow-sky-500/25 active:scale-[0.98] transition-all">
          <span>Buyurtmani rasmiylashtirish</span>
          <i data-lucide="check-circle" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </div>

  <script>
    // Telegram WebApp init
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    }

    // Default Products Catalog for MobiPrime.uz
    const PRODUCTS = [
      {
        id: 1,
        name: "AirPods Pro 2 (ANC 1:1 Lux)",
        category: "audio",
        price: 240000,
        image: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500&auto=format&fit=crop&q=80",
        tag: "Top Savdo",
        desc: "Shovqinni bostirish (ANC), shaffof rejim, toza bass va qulay sensor boshqaruv."
      },
      {
        id: 2,
        name: "Apple 20W Type-C Original Fast Adapter",
        category: "charge",
        price: 110000,
        image: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500&auto=format&fit=crop&q=80",
        tag: "Original",
        desc: "iPhone 11 dan 16 Pro Max gacha tezkor va xavfsiz 20W quvvatlash."
      },
      {
        id: 3,
        name: "Samsung 25W Type-C Super Fast",
        category: "charge",
        price: 95000,
        image: "https://images.unsplash.com/photo-1609592424364-7ef17a780b6a?w=500&auto=format&fit=crop&q=80",
        tag: "Super Fast",
        desc: "Samsung Galaxy S va A seriyalari uchun original 25W zaryadnik."
      },
      {
        id: 4,
        name: "Remax 20000mAh 22.5W Fast Powerbank",
        category: "powerbank",
        price: 220000,
        image: "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=500&auto=format&fit=crop&q=80",
        tag: "20000 mAh",
        desc: "LED displeyli, 22.5W tezkor quvvatlovchi ixcham va kuchli powerbank."
      },
      {
        id: 5,
        name: "Baseus MagSafe Magnetic Car Mount",
        category: "auto",
        price: 140000,
        image: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=500&auto=format&fit=crop&q=80",
        tag: "Avtomobil",
        desc: "Avtomobil deflektoriga qotadigan kuchli magnitli va aylanuvchi ushlagich."
      },
      {
        id: 6,
        name: "MagSafe Silicone Case (iPhone barcha modellar)",
        category: "cases",
        price: 75000,
        image: "https://images.unsplash.com/photo-1586953208448-b95a79798f07?w=500&auto=format&fit=crop&q=80",
        tag: "MagSafe",
        desc: "Ichki baxmal qatlamli, magnitli simsiz quvvatlashni qo'llab-quvvatlovchi chexol."
      },
      {
        id: 7,
        name: "10D Ceramic / Shisha Himoya Oynasi",
        category: "cases",
        price: 35000,
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=80",
        tag: "Himoya",
        desc: "To'liq ekran qoplovchi, tirnalish va sinishdan himoyalovchi sifatli oyna."
      },
      {
        id: 8,
        name: "Hoco Type-C to Lightning / Type-C 60W Kabel",
        category: "charge",
        price: 45000,
        image: "https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=500&auto=format&fit=crop&q=80",
        tag: "To'qilgan",
        desc: "Mustahkam matoli to'qilgan, bukilmaydigan 60W tezkor kabel (1.2m)."
      }
    ];

    // State
    let cart = {}; // { id: count }
    let currentCategory = "all";
    let searchQuery = "";

    // Format currency
    function formatSo(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
    }

    // Render Products
    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const noResults = document.getElementById("noResults");
      grid.innerHTML = "";

      const filtered = PRODUCTS.filter(p => {
        const matchCat = currentCategory === "all" || p.category === currentCategory;
        const matchQuery = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                           p.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        noResults.classList.remove("hidden");
        return;
      } else {
        noResults.classList.add("hidden");
      }

      filtered.forEach(p => {
        const inCartCount = cart[p.id] || 0;
        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between transition-transform active:scale-[0.99]";

        card.innerHTML = `
          <div>
            <div class="relative w-full aspect-square bg-slate-800 overflow-hidden">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
              ${p.tag ? `<span class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur-md text-[10px] font-bold text-sky-400 px-2 py-0.5 rounded-full border border-sky-500/20">${p.tag}</span>` : ""}
            </div>
            <div class="p-3">
              <h3 class="text-xs font-semibold text-white line-clamp-2 leading-snug mb-1">${p.name}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-1 mb-2">${p.desc}</p>
              <div class="text-sm font-bold text-sky-400">${formatSo(p.price)}</div>
            </div>
          </div>
          <div class="p-3 pt-0">
            ${inCartCount === 0 ? `
              <button onclick="addToCart(${p.id})" class="w-full py-2 px-3 rounded-xl bg-slate-800 hover:bg-sky-500 hover:text-white border border-slate-700/80 text-xs font-semibold text-sky-400 flex items-center justify-center space-x-1 transition-all active:scale-95">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Savatga</span>
              </button>
            ` : `
              <div class="w-full py-1.5 px-2 rounded-xl bg-sky-500 text-white flex items-center justify-between font-bold text-xs shadow-md shadow-sky-500/20">
                <button onclick="changeQty(${p.id}, -1)" class="w-6 h-6 rounded-lg bg-black/20 flex items-center justify-center active:scale-90">
                  <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                </button>
                <span>${inCartCount} dona</span>
                <button onclick="changeQty(${p.id}, 1)" class="w-6 h-6 rounded-lg bg-black/20 flex items-center justify-center active:scale-90">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `}
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
      updateCartUI();
    }

    // Add / Qty
    function addToCart(id) {
      cart[id] = 1;
      haptic();
      renderProducts();
    }

    function changeQty(id, delta) {
      haptic();
      if (!cart[id]) cart[id] = 0;
      cart[id] += delta;
      if (cart[id] <= 0) {
        delete cart[id];
      }
      renderProducts();
      renderCartItemsInModal();
    }

    function haptic() {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }
    }

    // Update Floating bar and badges
    function updateCartUI() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      let totalSum = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === parseInt(id));
        if (prod) totalSum += prod.price * qty;
      }

      const badge = document.getElementById("cartCountBadge");
      const floatingBar = document.getElementById("floatingCartBar");
      const floatCount = document.getElementById("floatingCartCount");
      const floatTotal = document.getElementById("floatingCartTotal");

      if (totalCount > 0) {
        badge.innerText = totalCount;
        badge.classList.remove("hidden");
        floatCount.innerText = `${totalCount} ta mahsulot`;
        floatTotal.innerText = formatSo(totalSum);
        floatingBar.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
        floatingBar.classList.add("hidden");
      }
    }

    // Categories
    function setCategory(cat) {
      haptic();
      currentCategory = cat;
      document.querySelectorAll(".cat-pill").forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-sky-500 text-white shadow-sm";
        } else {
          btn.className = "cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 border border-slate-700/60";
        }
      });
      renderProducts();
    }

    // Search
    function filterProducts() {
      searchQuery = document.getElementById("searchInput").value;
      renderProducts();
    }

    // Modal Cart Drawer
    function openCart() {
      haptic();
      const modal = document.getElementById("cartModal");
      modal.classList.remove("hidden");
      renderCartItemsInModal();

      // Pre-fill user data if Telegram provides
      if (tg?.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        const nameField = document.getElementById("custName");
        if (!nameField.value) {
          nameField.value = `${u.first_name || ""} ${u.last_name || ""}`.trim();
        }
      }
    }

    function closeCart() {
      haptic();
      document.getElementById("cartModal").classList.add("hidden");
    }

    function renderCartItemsInModal() {
      const list = document.getElementById("cartItemsList");
      const modalCount = document.getElementById("modalItemsCount");
      const modalTotal = document.getElementById("modalTotalSum");
      list.innerHTML = "";

      const entries = Object.entries(cart);
      if (entries.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Savatingiz bo'sh</p>`;
        modalCount.innerText = "0 ta tovar tanlandi";
        modalTotal.innerText = "0 so'm";
        return;
      }

      let totalSum = 0;
      let totalQty = 0;

      entries.forEach(([id, qty]) => {
        const prod = PRODUCTS.find(p => p.id === parseInt(id));
        if (!prod) return;
        const sum = prod.price * qty;
        totalSum += sum;
        totalQty += qty;

        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-800 border border-slate-700/60";
        row.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden">
            <img src="${prod.image}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">
            <div class="overflow-hidden">
              <h4 class="text-xs font-semibold text-white truncate">${prod.name}</h4>
              <p class="text-[11px] text-sky-400 font-bold mt-0.5">${formatSo(prod.price)}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2 flex-shrink-0">
            <button onclick="changeQty(${prod.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-700 text-slate-200 flex items-center justify-center active:scale-90">
              <i data-lucide="minus" class="w-3.5 h-3.5"></i>
            </button>
            <span class="text-xs font-bold text-white w-4 text-center">${qty}</span>
            <button onclick="changeQty(${prod.id}, 1)" class="w-7 h-7 rounded-lg bg-sky-500 text-white flex items-center justify-center active:scale-90">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        list.appendChild(row);
      });

      modalCount.innerText = `${totalQty} ta tovar tanlandi`;
      modalTotal.innerText = formatSo(totalSum);
      lucide.createIcons();
    }

    // Submit Order
    function submitOrder() {
      const entries = Object.entries(cart);
      if (entries.length === 0) {
        alert("Iltimos, avval mahsulot tanlang!");
        return;
      }

      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const payMethod = document.querySelector('input[name="payMethod"]:checked')?.value || "Naqd";
      const comment = document.getElementById("custComment").value.trim();

      if (!name) {
        alert("Iltimos, ismingizni kiriting!");
        return;
      }
      if (!phone || phone.length < 7) {
        alert("Iltimos, telefon raqamingizni to'liq kiriting!");
        return;
      }
      if (!address) {
        alert("Iltimos, yetkazib berish manzilini kiriting!");
        return;
      }

      const items = entries.map(([id, qty]) => {
        const prod = PRODUCTS.find(p => p.id === parseInt(id));
        return {
          id: prod.id,
          name: prod.name,
          price: prod.price,
          qty: qty,
          total: prod.price * qty
        };
      });

      const totalAmount = items.reduce((acc, cur) => acc + cur.total, 0);

      const orderData = {
        action: "new_order",
        customer: {
          name: name,
          phone: phone,
          address: address,
          comment: comment,
          pay_method: payMethod,
          tg_user: tg?.initDataUnsafe?.user || null
        },
        items: items,
        total_amount: totalAmount,
        currency: "so'm",
        date: new Date().toISOString()
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(orderData));
      } else {
        // Fallback for regular browser test
        alert("Buyurtma qabul qilindi!\nJami: " + formatSo(totalAmount));
        cart = {};
        closeCart();
        renderProducts();
      }
    }

    // Initial load
    renderProducts();
  </script>
</body>
</html>
